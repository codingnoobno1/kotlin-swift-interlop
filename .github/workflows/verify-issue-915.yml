name: Verify issue 915

permissions:
  contents: read

on:
  push:
  pull_request:

concurrency:
  group: verify-915-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test async exception preservation
    runs-on: ubuntu-latest
    container:
      image: swift:6.3-noble
    steps:
      - uses: actions/checkout@v7

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Show toolchain
        run: |
          swift --version
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

      - name: Build
        run: |
          set +e
          swift build --build-tests --disable-sandbox --disable-experimental-prebuilts > build.log 2>&1
          status=$?
          tail -n 40 build.log
          if [ "$status" -ne 0 ]; then
            tail -n 25 build.log | while IFS= read -r line; do
              line=${line//%/%25}
              line=${line//$'\r'/%0D}
              echo "::error::$line"
            done
          fi
          exit "$status"

      - name: Test issue 915
        run: |
          set +e
          swift test --disable-xctest --disable-experimental-prebuilts --filter asyncFailurePreservesJavaExceptionCause > test.log 2>&1
          status=$?
          tail -n 40 test.log
          if [ "$status" -ne 0 ]; then
            tail -n 25 test.log | while IFS= read -r line; do
              line=${line//%/%25}
              line=${line//$'\r'/%0D}
              echo "::error::$line"
            done
          else
            tail -n 15 test.log | while IFS= read -r line; do
              line=${line//%/%25}
              line=${line//$'\r'/%0D}
              echo "::notice::$line"
            done
          fi
          exit "$status"
