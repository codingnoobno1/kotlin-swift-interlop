name: Verify issue 915

permissions:
  contents: read

on:
  push:
  pull_request:

concurrency:
  group: verify-915-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test async exception preservation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.3"

      - name: Install JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Build
        run: swift build --disable-experimental-prebuilts

      - name: Test issue 915
        run: swift test --filter asyncFailurePreservesJavaExceptionCause --disable-experimental-prebuilts
